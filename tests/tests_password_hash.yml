---
- name: Test precomputed bootloader password hashes
  hosts: all
  tasks:
    - name: Skip on s390x architecture
      ansible.builtin.include_tasks: tasks/skip_on_s390x.yml

    - name: Test hash configuration and clean up afterwards
      block:
        - name: Configure a precomputed password hash
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            bootloader_password_hash: "{{ __bootloader_test_hash }}"
            __sr_public: true

        - name: Read the configured password
          ansible.builtin.slurp:
            src: "{{ __bootloader_user_conf }}"
          register: __bootloader_test_content

        - name: Verify the exact hash was installed
          ansible.builtin.assert:
            that:
              - >-
                __bootloader_test_content.content | b64decode ==
                'GRUB2_PASSWORD=' ~ __bootloader_test_hash

        - name: Record password file state
          ansible.builtin.stat:
            path: "{{ __bootloader_user_conf }}"
          register: __bootloader_test_before

        - name: Configure the same hash again
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            bootloader_password_hash: "{{ __bootloader_test_hash }}"

        - name: Predict changing the hash in check mode
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml
            apply:
              check_mode: true
              diff: true
          vars:
            bootloader_password_hash: "{{ __bootloader_test_new_hash }}"

        - name: Verify password file is unchanged
          ansible.builtin.stat:
            path: "{{ __bootloader_user_conf }}"
          register: __bootloader_test_after

        - name: Assert idempotency and check mode preserved the file
          ansible.builtin.assert:
            that:
              - >-
                __bootloader_test_before.stat.checksum ==
                __bootloader_test_after.stat.checksum
              - >-
                __bootloader_test_before.stat.mtime ==
                __bootloader_test_after.stat.mtime
              - __bootloader_test_after.stat.mode == __bootloader_conf_mode

        - name: Change the password hash
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            bootloader_password_hash: "{{ __bootloader_test_new_hash }}"

        - name: Leave the password unmanaged
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            bootloader_password_hash: null

        - name: Read the changed password
          ansible.builtin.slurp:
            src: "{{ __bootloader_user_conf }}"
          register: __bootloader_test_content

        - name: Verify the changed hash was preserved
          ansible.builtin.assert:
            that:
              - >-
                __bootloader_test_content.content | b64decode ==
                'GRUB2_PASSWORD=' ~ __bootloader_test_new_hash

        - name: Remove the password
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            bootloader_remove_password: true

        - name: Check password file was removed
          ansible.builtin.stat:
            path: "{{ __bootloader_user_conf }}"
          register: __bootloader_test_removed

        - name: Assert password file was removed
          ansible.builtin.assert:
            that: not __bootloader_test_removed.stat.exists
      always:
        - name: Remove test password
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            bootloader_password_hash: null
            bootloader_remove_password: true
          tags: tests::cleanup
