# SPDX-License-Identifier: MIT
---
- name: Reset password hash validation result
  ansible.builtin.set_fact:
    __bootloader_test_hash_rejected: false

- name: Try invalid password hash settings
  block:
    - name: Validate invalid password hash settings
      ansible.builtin.include_tasks: run_role_with_clear_facts.yml
      vars:
        __sr_tasks_from: assert_role_vars.yml
        bootloader_password_hash: "{{ __bootloader_test_invalid_hash.hash }}"
        bootloader_password: >-
          {{ __bootloader_test_invalid_hash.password | default(none) }}
        bootloader_remove_password: >-
          {{ __bootloader_test_invalid_hash.remove | default(false) }}
        # Test-only values; expose the assertion message to verify the failure.
        bootloader_secure_logging: false
  rescue:
    - name: Verify failure comes from password hash validation
      ansible.builtin.assert:
        that:
          - "'bootloader_password_hash' in ansible_failed_result.msg"

    - name: Record expected validation failure
      ansible.builtin.set_fact:
        __bootloader_test_hash_rejected: true

- name: Assert invalid password hash settings were rejected
  ansible.builtin.assert:
    that: __bootloader_test_hash_rejected
