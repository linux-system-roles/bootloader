---
- name: Test the boot loader password on SUSE
  hosts: all
  tags:
    - tests::reboot
  vars:
    __password_script: /etc/grub.d/01_password
  tasks:
    - name: Skip on s390x architecture
      include_tasks: tasks/skip_on_s390x.yml

    - name: Skip on platforms other than SUSE
      meta: end_host
      when: ansible_facts['os_family'] != 'Suse'

    - name: Run in a block to clean up afterwards
      block:
        - name: Reset bootloader_reboot_required
          set_fact:
            bootloader_reboot_required: false

        - name: Set boot loader password
          vars:
            bootloader_password: test-pass
            __sr_public: true
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Flush handlers
          meta: flush_handlers

        - name: Verify the password needs a reboot only on transactional systems
          assert:
            that:
              - __bootloader_settings_result is changed
              - bootloader_reboot_required == __bootloader_is_transactional

        - name: Read the generated GRUB configuration
          slurp:
            src: "{{ __bootloader_grub_conf }}"
          register: __grub_cfg

        - name: Verify the password protects the boot loader
          assert:
            that:
              - __content is search('set superusers="root"')
              - __content is
                search('password_pbkdf2 root grub\.pbkdf2\.sha512\.')
              - __content is search('set unrestricted_menu="y"')
          vars:
            __content: "{{ __grub_cfg.content | b64decode }}"

        - name: Verify mode of the password script and the GRUB configuration
          stat:
            path: "{{ item.file }}"
          register: __mode_stat
          failed_when: __mode_stat.stat.mode != item.mode
          loop:
            - file: "{{ __password_script }}"
              mode: "0700"
            - file: "{{ __bootloader_grub_conf }}"
              mode: "{{ __bootloader_conf_mode }}"

        - name: Record the password script
          stat:
            path: "{{ __password_script }}"
          register: __script_before

        - name: Reset bootloader_reboot_required
          set_fact:
            bootloader_reboot_required: false

        - name: Set the same password again, should report not changed
          vars:
            bootloader_password: test-pass
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Flush handlers
          meta: flush_handlers

        - name: Record the password script again
          stat:
            path: "{{ __password_script }}"
          register: __script_after

        - name: Verify the same password left everything unchanged
          assert:
            that:
              - __bootloader_settings_result is not changed
              - not bootloader_reboot_required
              - __script_before.stat.checksum == __script_after.stat.checksum

        - name: Read the password script
          slurp:
            src: "{{ __password_script }}"
          register: __script

        - name: Install the same hash precomputed, should report not changed
          vars:
            bootloader_password_hash: >-
              {{ (__script.content | b64decode |
              regex_search('grub\.pbkdf2\.sha512\.\S+')) }}
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Flush handlers
          meta: flush_handlers

        - name: Verify the precomputed hash left everything unchanged
          assert:
            that:
              - __bootloader_settings_result is not changed
              - not bootloader_reboot_required

        - name: Reboot, the default entry must still boot without a password
          reboot:

        - name: Remove boot loader password
          vars:
            bootloader_remove_password: true
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Read the GRUB configuration without a password
          slurp:
            src: "{{ __bootloader_grub_conf }}"
          register: __grub_cfg

        - name: Check for the password script
          stat:
            path: "{{ __password_script }}"
          register: __script_removed

        - name: Verify the password is gone
          assert:
            that:
              - not __script_removed.stat.exists
              - __grub_cfg.content | b64decode is not search('password_pbkdf2')

        - name: Remove boot loader password again, should report not changed
          vars:
            bootloader_remove_password: true
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Verify the second removal changed nothing
          assert:
            that: __bootloader_settings_result is not changed
      always:
        - name: Remove boot loader password
          vars:
            bootloader_remove_password: true
          include_tasks: tasks/run_role_with_clear_facts.yml
          tags: tests::cleanup
